# GitHub Actions — probe image GHCR pe push (free, no-CC)
# ClawCloud me app create karte waqt ye image use hogi:
#   ghcr.io/<github-username>/preopen-probe:latest
name: probe-image
on:
  push:
    branches: [main]
    paths: ["deploy/**", "scanner/**", ".github/workflows/**"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/preopen-probe:latest
            ghcr.io/${{ github.repository_owner }}/preopen-probe:${{ github.sha }}
