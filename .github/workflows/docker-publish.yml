# GitHub Actions — dono images GHCR pe push (free, no-CC):
#   probe   : ghcr.io/<user>/preopen-probe:latest    (deploy/Dockerfile — NSE feasibility probe)
#   scanner : ghcr.io/<user>/preopen-scanner:latest  (deploy/Dockerfile.app — FULL dashboard+poller app)
name: docker-images
on:
  push:
    branches: [main]
    paths: ["deploy/**", "scanner/**", ".github/workflows/**"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/preopen-probe:latest
            ghcr.io/${{ github.repository_owner }}/preopen-probe:${{ github.sha }}

      - name: Build + push full scanner app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.app
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/preopen-scanner:latest
            ghcr.io/${{ github.repository_owner }}/preopen-scanner:${{ github.sha }}
